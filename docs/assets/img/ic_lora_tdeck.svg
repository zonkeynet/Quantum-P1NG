<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g id="tdeck_twotone">
    <!-- SMA Antenna (Left Top) -->
    <!-- Threaded collar -->
    <path d="M 33 5 L 39 5 C 40 5 40.5 5.5 40.5 6.5 L 40.5 17 L 31.5 17 L 31.5 6.5 C 31.5 5.5 32 5 33 5 Z" fill="#000000" />
    <line x1="33" y1="8" x2="39" y2="8" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="33" y1="11" x2="39" y2="11" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="33" y1="14" x2="39" y2="14" stroke="#FFFFFF" stroke-width="1.2" />
    <rect x="30" y="16" width="12" height="3" rx="0.8" fill="#000000" />

    <!-- Outer Chassis (Solid White Fill with Solid Black Double Border) -->
    <path d="M 32 17 L 68 17 C 76 17 82 23 82 31 L 82 82 C 82 90 75 97 66 97 L 34 97 C 25 97 18 90 18 82 L 18 31 C 18 23 24 17 32 17 Z" 
          fill="#FFFFFF" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Inner chassis bevel line -->
    <path d="M 32 20 L 68 20 C 74 20 79 25 79 31 L 79 82 C 79 88 73 94 66 94 L 34 94 C 27 94 21 88 21 82 L 21 31 C 21 25 26 20 32 20 Z" 
          fill="none" stroke="#000000" stroke-width="1" />

    <!-- Speaker Slit -->
    <rect x="44" y="24" width="12" height="2.2" rx="1.1" fill="#000000" />

    <!-- "LILYGO" top text -->
    <text x="50" y="30.5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="3.5" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="0.5">LILYGO</text>

    <!-- SCREEN: Solid Black Display Area -->
    <rect x="25" y="33" width="50" height="29" rx="2" fill="#000000" />

    <!-- Screen Content (Crisp White Graphics inside the Black Screen) -->
    <!-- TX / RX Status Badges -->
    <rect x="28" y="36" width="7" height="4.5" rx="0.8" fill="#FFFFFF" />
    <text x="31.5" y="39.4" font-family="monospace" font-size="2.6" font-weight="900" text-anchor="middle" fill="#000000">TX</text>
    <rect x="36.5" y="36" width="7" height="4.5" rx="0.8" fill="#FFFFFF" />
    <text x="40" y="39.4" font-family="monospace" font-size="2.6" font-weight="900" text-anchor="middle" fill="#000000">RX</text>
    <rect x="45" y="36" width="5" height="4.5" rx="0.8" fill="#FFFFFF" />
    <rect x="51.5" y="36" width="5" height="4.5" rx="0.8" fill="#FFFFFF" />

    <!-- LoRa Waveform & Telemetry Blocks -->
    <rect x="28" y="44" width="3.5" height="3" rx="0.5" fill="#FFFFFF" />
    <rect x="28" y="48.5" width="3.5" height="3" rx="0.5" fill="#FFFFFF" />
    <path d="M 33 46 L 35 44 L 38 49 L 41 43 L 44 46 L 47 46" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="33" y1="50" x2="40" y2="50" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

    <!-- Right Telemetry Blocks & Lines -->
    <rect x="50.5" y="44" width="3.5" height="3" rx="0.5" fill="#FFFFFF" />
    <rect x="50.5" y="48.5" width="3.5" height="3" rx="0.5" fill="#FFFFFF" />
    <line x1="56" y1="44.5" x2="68" y2="44.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="56" y1="47" x2="65" y2="47" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="56" y1="49.5" x2="68" y2="49.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="56" y1="52" x2="62" y2="52" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

    <!-- Trackball Navigation Bar -->
    <!-- Center Jogball: Black Ring with Inner Circle -->
    <circle cx="50" cy="65.5" r="4.2" fill="#000000" />
    <circle cx="50" cy="65.5" r="2.2" fill="#FFFFFF" />

    <!-- Left & Right Chevrons & Accents -->
    <path d="M 23 66 L 27 66 L 31 63 L 41 63 L 42 66" fill="none" stroke="#000000" stroke-width="1.2" />
    <path d="M 33 64.5 L 35.5 66.5 L 33 68.5 M 36.5 64.5 L 39 66.5 L 36.5 68.5 M 40 64.5 L 42.5 66.5 L 40 68.5" fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 77 66 L 73 66 L 69 63 L 59 63 L 58 66" fill="none" stroke="#000000" stroke-width="1.2" />
    <path d="M 67 64.5 L 64.5 66.5 L 67 68.5 M 63.5 64.5 L 61 66.5 L 63.5 68.5 M 60 64.5 L 57.5 66.5 L 60 68.5" fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- KEYBOARD: Solid Black Keypad Housing -->
    <rect x="23" y="70" width="54" height="23" rx="3.5" fill="#000000" />

    <!-- Keyboard Rows of Rounded White Keys -->
    <!-- Row 1 (8 keys) -->
    <rect x="25.5" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="31.8" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="38.1" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="44.4" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="50.7" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="57" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="63.3" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="69.6" y="72" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />

    <!-- Row 2 (8 keys) -->
    <rect x="25.5" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="31.8" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="38.1" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="44.4" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="50.7" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="57" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="63.3" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="69.6" y="77" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />

    <!-- Row 3 (8 keys) -->
    <rect x="25.5" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="31.8" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="38.1" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="44.4" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="50.7" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="57" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="63.3" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />
    <rect x="69.6" y="82" width="4.5" height="3.6" rx="1.2" fill="#FFFFFF" />

    <!-- Row 4: Keys + Center Wide Spacebar -->
    <rect x="28" y="87" width="5.5" height="3.8" rx="1.4" fill="#FFFFFF" />
    <rect x="35" y="87" width="5.5" height="3.8" rx="1.4" fill="#FFFFFF" />
    <rect x="42" y="87" width="16" height="3.8" rx="1.6" fill="#FFFFFF" />
    <rect x="59.5" y="87" width="5.5" height="3.8" rx="1.4" fill="#FFFFFF" />
    <rect x="66.5" y="87" width="5.5" height="3.8" rx="1.4" fill="#FFFFFF" />

    <!-- Bottom "LILYGO" Text -->
    <text x="50" y="95.5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="2.8" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="0.4">LILYGO</text>
  </g>
