<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Brain outline — left hemisphere -->
  <path d="M 6,15 Q 5,8 11,6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Brain outline — right hemisphere -->
  <path d="M 13,6 Q 19,8 18,15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Brain bottom -->
  <path d="M 6,15 Q 6,19 12,19 Q 18,19 18,15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Brain top connection (corpus callosum line) -->
  <path d="M 11,6 Q 12,5 13,6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Central sulcus divider -->
  <path d="M 12,6 L 12,15" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Neural circuit inside — horizontal wire -->
  <path d="M 8,11 L 16,11" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/>
  <!-- Neural branches -->
  <path d="M 9,11 L 8,9 M 9,11 L 8,13 M 15,11 L 16,9 M 15,11 L 16,13" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Synapse node dots -->
  <circle cx="8" cy="11" r="0.9" fill="currentColor"/>
  <circle cx="12" cy="11" r="1.1" fill="currentColor"/>
  <circle cx="16" cy="11" r="0.9" fill="currentColor"/>
  <circle cx="8" cy="9" r="0.6" fill="currentColor"/>
  <circle cx="8" cy="13" r="0.6" fill="currentColor"/>
  <circle cx="16" cy="9" r="0.6" fill="currentColor"/>
  <circle cx="16" cy="13" r="0.6" fill="currentColor"/>
</svg>
